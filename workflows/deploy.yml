name: Deploy Dashboard to VPS

on:
  push:
    branches:
      - main # Change this if your primary branch is named 'master'

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          # Update the cd path below to where your project lives on the VPS
          script: |
            echo "Navigating to project directory..."
            cd /var/www/lead-dashboard 
            
            echo "Pulling latest code from GitHub..."
            git pull origin main
            
            echo "Installing backend dependencies..."
            npm install
            
            echo "Building frontend..."
            CI=true NODE_OPTIONS="--max-old-space-size=1024" npm run build
            
            echo "Restarting backend server..."
            pm2 restart all
            
            echo "Deployment Successful!"